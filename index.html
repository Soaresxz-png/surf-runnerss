<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Surf Runners</title>

<style>
body{margin:0;overflow:hidden;font-family:Arial;background:#0288d1}
canvas{display:block;margin:auto;background:#4fc3f7}
#panel{
 position:absolute;inset:0;
 background:linear-gradient(#2196f3,#0d47a1);
 color:#fff;display:flex;flex-direction:column;
 align-items:center;overflow-y:auto;
 padding:20px 0
}
button{
 width:85%;max-width:340px;
 padding:14px;font-size:18px;
 border:none;border-radius:16px;
 background:#ff7043;color:#fff;
 margin:6px;
 box-shadow:0 5px #d84315
}
button:active{transform:translateY(4px);box-shadow:0 1px #d84315}
.card{
 width:90%;background:rgba(0,0,0,.35);
 padding:12px;margin:6px;border-radius:12px
}
.done{opacity:.5;text-decoration:line-through}
</style>
</head>

<body>

<canvas id="game" width="360" height="640"></canvas>
<div id="panel"></div>

<script>
/* ================= CANVAS ================= */
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const panel=document.getElementById("panel");
const lanes=[80,180,280];

/* ================= SAVE ================= */
let coinsTotal=+localStorage.getItem("coins")||0;
let record=+localStorage.getItem("record")||0;
let unlocked=JSON.parse(localStorage.getItem("unlocked"))||[0];
let selectedCharacter=+localStorage.getItem("selectedCharacter")||0;
let missions=JSON.parse(localStorage.getItem("missions"))||[];

/* ================= PASSIVAS ================= */
const rarityPassives={
 comum:{speed:1,coin:1.1,hitbox:1},
 raro:{speed:1.05,coin:1.2,hitbox:0.97},
 epico:{speed:1.1,coin:1.35,hitbox:0.95},
 mitico:{speed:1.15,coin:1.5,hitbox:0.93},
 lendario:{speed:1.2,coin:1.7,hitbox:0.9}
};

/* ================= PERSONAGENS ================= */
const characters=[];
let id=0;
function add(list,rarity,price){
 list.forEach(n=>{
  characters.push({
   id:id++,
   name:n,
   rarity,
   price,
   passive:rarityPassives[rarity]
  });
 });
}
add(["Zion","Lumi","Kiara","Amora","Cora","Gaia","Moana","Suri","Ayla","Nalu"],"comum",100);
add(["Gael","Dante","Eros","Iago","Kenji","Milo","Noah","Otto","Ravi","Zayn"],"raro",200);
add(["Ametista","Artemis","Pandora","Selene","Íris","Lyra","Cleo","Jade","Aurora","Maya","Luna","Yara","Zoe","Fang","Kora","Ananda","Ximena","Pietra","Noa"],"epico",450);
add(["Raul","Apolo","Horus","Júpiter","Wolf","Ícaro","Dominic","Asher","Valentin","Luan"],"mitico",800);
add(["Isa Bastos","Leon","Godoy","Fink","Lourenço","Woodle"],"lendario",1000);

/* ================= MISSÕES ================= */
if(missions.length===0){
 for(let i=1;i<=30;i++){
  missions.push({
   description:`Faça ${i*1000} pontos`,
   goal:i*1000,
   reward:150+i*50,
   completed:false
  });
 }
}

/* ================= MENU ================= */
function showMenu(){
 panel.innerHTML=`
 <h1>🏄 Surf Runners</h1>
 <p>🪙 ${coinsTotal} | 🏆 ${record}</p>
 <button onclick="start()">▶ Jogar</button>
 <button onclick="showCharacters()">🧍 Personagens</button>
 <button onclick="showShop()">🏪 Loja</button>
 <button onclick="showMissions()">📜 Missões</button>
 `;
 panel.style.display="flex";
}

/* ================= PERSONAGENS ================= */
function showCharacters(){
 panel.innerHTML="<h1>🧍 Personagens</h1>";
 characters.forEach(c=>{
  if(!unlocked.includes(c.id))return;
  panel.innerHTML+=`
  <div class="card">
   <b>${c.name}</b> (${c.rarity})<br>
   🏃 x${c.passive.speed} | 🪙 x${c.passive.coin}
   <button onclick="selectCharacter(${c.id})">
    ${selectedCharacter===c.id?"✅ Selecionado":"Selecionar"}
   </button>
  </div>`;
 });
 panel.innerHTML+=`<button onclick="showMenu()">⬅ Voltar</button>`;
}
function selectCharacter(i){
 selectedCharacter=i;
 localStorage.setItem("selectedCharacter",i);
 showCharacters();
}

/* ================= LOJA ================= */
function showShop(){
 panel.innerHTML="<h1>🏪 Loja</h1>";
 characters.forEach(c=>{
  panel.innerHTML+=`
  <button onclick="buy(${c.id})">
   ${c.name} (${c.rarity})<br>
   ${unlocked.includes(c.id)?"DESBLOQUEADO":"🪙 "+c.price}
  </button>`;
 });
 panel.innerHTML+=`<button onclick="showMenu()">⬅ Voltar</button>`;
}
function buy(id){
 const c=characters.find(x=>x.id===id);
 if(unlocked.includes(id))return;
 if(coinsTotal>=c.price){
  coinsTotal-=c.price;
  unlocked.push(id);
  save();
 }
 showShop();
}

/* ================= MISSÕES UI ================= */
function showMissions(){
 panel.innerHTML="<h1>📜 Missões</h1>";
 missions.forEach(m=>{
  panel.innerHTML+=`
  <div class="card ${m.completed?'done':''}">
   ${m.description}<br>
   🪙 ${m.reward}
  </div>`;
 });
 panel.innerHTML+=`<button onclick="showMenu()">⬅ Voltar</button>`;
}

/* ================= JOGO ================= */
let lane=1,playerY=520;
let obstacles=[],coins=[];
let score=0,coinsRun=0,timeAlive=0,gameOver=false;
let passive,bgOffset=0;

function start(){
 panel.style.display="none";
 obstacles=[];coins=[];
 score=0;coinsRun=0;timeAlive=0;
 gameOver=false;lane=1;
 passive=characters[selectedCharacter].passive;
 requestAnimationFrame(loop);
}

function drawBackground(){
 bgOffset+=6*passive.speed;
 ctx.fillStyle="#4fc3f7";
 ctx.fillRect(0,0,360,640);
 ctx.fillStyle="#0288d1";
 for(let y=-40;y<700;y+=80){
  ctx.fillRect(0,(y+bgOffset)%700,360,40);
 }
}

function loop(){
 if(gameOver)return;
 drawBackground();
 timeAlive+=1/60;

 if(Math.random()<0.04)
  obstacles.push({lane:Math.random()*3|0,y:-40,size:14+Math.random()*10});
 if(Math.random()<0.07)
  coins.push({lane:Math.random()*3|0,y:-20,pulse:0});

 obstacles=obstacles.filter(o=>{
  o.y+=7*passive.speed;
  ctx.fillStyle="#e53935";
  ctx.beginPath();
  ctx.arc(lanes[o.lane],o.y,o.size,0,Math.PI*2);
  ctx.fill();
  if(o.lane===lane && Math.abs(o.y-playerY)<(o.size+8)*passive.hitbox)
   gameOver=true;
  return o.y<700;
 });

 coins=coins.filter(c=>{
  c.y+=7*passive.speed;
  c.pulse+=0.1;
  ctx.fillStyle=`rgba(255,215,0,${0.6+Math.sin(c.pulse)*0.4})`;
  ctx.beginPath();
  ctx.arc(lanes[c.lane],c.y,10,0,Math.PI*2);
  ctx.fill();
  if(c.lane===lane && Math.abs(c.y-playerY)<18){
   const gain=Math.round((2+timeAlive/5)*passive.coin);
   coinsRun+=gain;
   coinsTotal+=gain;
   return false;
  }
  return c.y<700;
 });

 const char=characters[selectedCharacter];
 ctx.fillStyle="#000";
 ctx.beginPath();
 ctx.arc(lanes[lane],playerY,16,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle="#fff";
 ctx.font="bold 12px Arial";
 ctx.textAlign="center";
 ctx.fillText(char.name,lanes[lane],playerY-24);

 score+=Math.floor(3+timeAlive/2);

 ctx.fillText("🏄 "+score,10,20);
 ctx.fillText("🪙 "+coinsRun,10,40);

 if(!gameOver)requestAnimationFrame(loop);
 else{
  record=Math.max(record,score);
  missions.forEach(m=>{
   if(!m.completed && score>=m.goal){
    m.completed=true;
    coinsTotal+=m.reward;
   }
  });
  save();
  showMenu();
 }
}

/* ================= CONTROLES ================= */
document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"&&lane>0)lane--;
 if(e.key==="ArrowRight"&&lane<2)lane++;
});
canvas.addEventListener("touchstart",e=>{
 const x=e.touches[0].clientX;
 if(x<180&&lane>0)lane--;
 else if(lane<2)lane++;
},{passive:true});

/* ================= SAVE ================= */
function save(){
 localStorage.setItem("coins",coinsTotal);
 localStorage.setItem("record",record);
 localStorage.setItem("missions",JSON.stringify(missions));
 localStorage.setItem("unlocked",JSON.stringify(unlocked));
}

showMenu();
</script>
</body>
  </html>
